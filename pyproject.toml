[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vernesoft"
version = "1.4.1"
description = "Official Python SDK for Nautilus by Verne Software: sign-in and users, webhook delivery, cron jobs and Telegram sign-in. Hosted in France."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Verne Software" }]
keywords = [
    "nautilus",
    "verne",
    "sdk",
    "authentication",
    "webhooks",
    "cron",
    "telegram-login",
    "jwt",
    "ory-kratos",
    "svix",
    "gdpr",
    "eu-hosted",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://vernesoft.com"
Documentation = "https://docs.vernesoft.com"
Source = "https://github.com/Verne-Software/vrn-sdk-python"
Changelog = "https://github.com/Verne-Software/vrn-sdk-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Offline verification of Gate signed tokens (GateTokenVerifier, tokens.verify_signed).
jwt = ["cryptography>=41"]
dev = ["pytest", "pytest-asyncio", "pytest-httpx", "mypy", "ruff", "cryptography>=41"]

[tool.hatch.build.targets.wheel]
packages = ["src/vernesoft"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The live suite (tests/integration) runs only on request: `pytest -m integration`.
addopts = "-m 'not integration'"
markers = ["integration: opt-in tests against a running Nautilus stack (VERNE_API_KEY)"]
